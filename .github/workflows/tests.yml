name: tests

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ".[dev]"
      - name: Vérifications avant commit (dont Ruff bloquant)
        run: pre-commit run --all-files
      - name: Ruff (règles étendues, informatif)
        run: ruff check qcm_papier tests --select E,W,F,I,B,UP,SIM --statistics --exit-zero
      - name: Formatage (informatif)
        run: ruff format --check qcm_papier tests
        continue-on-error: true

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies (sans GTK)
        run: |
          python -m pip install --upgrade pip
          pip install .[test]

      - name: Run tests (sans GTK)
        env:
          QCM_PAPIER_NO_GUI: "1"
        run: |
          python -m pytest tests/ -v
