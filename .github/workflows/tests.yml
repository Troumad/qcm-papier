name: tests

on:
  push:
  pull_request:

jobs:
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Syntaxe JavaScript
        run: |
          for script in qcm_papier/web/static/*.js; do
            node --check "$script"
          done
      - name: Tests du rendu de l'aide
        run: node --test tests/js/*.cjs

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install ".[dev]"
      - name: Vérifications avant commit (dont Ruff bloquant)
        run: pre-commit run --all-files
      - name: Ruff (règles étendues, informatif)
        run: ruff check qcm_papier tests --select E,W,F,I,B,UP,SIM --statistics --exit-zero
      - name: Formatage (informatif)
        run: |
          status=0
          ruff format --check qcm_papier tests || status=$?
          if [ "$status" -eq 1 ]; then
            echo "Des fichiers peuvent être reformatés ; ce contrôle est informatif." >> "$GITHUB_STEP_SUMMARY"
          elif [ "$status" -ne 0 ]; then
            exit "$status"
          fi

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies (sans GTK)
        run: |
          python -m pip install --upgrade pip
          pip install .[test]

      - name: Run tests (sans GTK)
        env:
          QCM_PAPIER_NO_GUI: "1"
        run: |
          python -m pytest tests/ -v
