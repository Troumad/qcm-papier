[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "qcm-papier"
version = "0.1.0"
description = "Générateur/Correcteur de QCM papier — portage Python/GTK 4 depuis le code HTML+JS de l'Université Lyon 1"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
authors = [
    { name = "Portage Python" },
]
dependencies = [
    "reportlab>=4.0",
    "openpyxl>=3.0",
    "Pillow>=10.0",
    "PyMuPDF>=1.23",
    "numpy>=1.20",
]

[project.optional-dependencies]
gui = [
    "PyGObject>=3.42",
]
test = [
    "pytest>=7.0",
]
dev = [
    "pytest>=7.0",
    "ruff==0.6.9",
    "pre-commit>=3.5",
]

[project.scripts]
qcm-papier = "qcm_papier.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["qcm_papier*"]

[tool.setuptools.package-data]
qcm_papier = ["data/scodoc/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
# Étape 1 : seules les vraies erreurs bloquent (syntaxe, noms non définis,
# comparaisons invalides). Les autres règles sont signalées par la CI sans
# bloquer, en attendant un commit de nettoyage dédié.
select = ["E9", "F63", "F7", "F82"]
