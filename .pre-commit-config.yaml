# Vérifications lancées avant chaque commit.
# Installation : uv sync --extra dev puis uv run pre-commit install
# (sans uv : pip install -e ".[dev]" puis pre-commit install)
# Le formatage Python est vérifié automatiquement avec Ruff.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-toml
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=2000"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
      - id: ruff-format

  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        args: ["-c", "pyproject.toml", "-r", "qcm_papier"]
        pass_filenames: false
        additional_dependencies: ["bandit[toml]"]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
      - id: gitleaks
        alias: gitleaks-history
        name: Secrets dans tout l'historique Git
        entry: gitleaks git --redact --log-opts=--all
        stages: [manual]
        always_run: true
